<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 235" width="880" height="235" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFB05C"/><stop offset="1" stop-color="#FF6B00"/></linearGradient></defs>
<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<text x="10" y="26" font-size="12" fill="#FF8C32" font-weight="600" text-anchor="start" letter-spacing="3" class="fade">05 — the route</text><line x1="150.8" y1="21" x2="870" y2="21" stroke="#30363d" stroke-width="1"/>
<line x1="60" y1="150" x2="110" y2="150" stroke="#30363d" stroke-width="1.5"/>
<line x1="110" y1="150" x2="840" y2="150" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="110" y="106" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle">software intern</text>
<text x="110" y="124" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle">void studio</text>
<circle class="ping" cx="110" cy="150" r="10" fill="none" stroke="#FF8C32" stroke-width="1"/>
<circle cx="110" cy="150" r="5" fill="#FF8C32"/>
<text x="110" y="178" font-size="10" fill="#8b949e" font-weight="400" text-anchor="middle">jul 2026 – present</text>
<text x="840" y="178" font-size="10" fill="#8b949e" font-weight="400" text-anchor="end" font-style="italic" opacity="0.6">the road ahead</text>
</svg>
